# Local services for Rota. Passwords here are for local development only.
services:
  pg0:
    image: postgres:16
    environment:
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: rota_local_only
      POSTGRES_DB: rota_shard0
    ports: ["5440:5432"]
    volumes: ["pg0data:/var/lib/postgresql/data"]
  pg1:
    image: postgres:16
    environment:
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: rota_local_only
      POSTGRES_DB: rota_shard1
    ports: ["5441:5432"]
    volumes: ["pg1data:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  pg0data:
  pg1data:
